<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- SEO -->

    <!-- Open Graph -->
    <meta property="og:type" content="website">

    <!-- Performance -->
    <link rel="preload" as="image" href="assets/hero-poster.webp">

    <!-- Favicon -->
    <link rel="icon" href="assets/favicon.ico" sizes="any">
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">

    <!-- Styles -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Preloader -->
    <div id="preloader">
        <div class="logo-pulse">Nexus Clean</div>
    </div>

    <!-- Custom Cursor -->
    <div id="cursor-dot"></div>
    <div id="cursor-outline"></div>

    <!-- Header -->
    <header id="main-header">
        <nav>
            <a href="#" class="logo">Nexus Clean</a>
            <!-- Main Navigation Links placeholder if needed, specific requirement was button -->
            <button class="btn-client-access">Acceso Clientes</button>

    <main>

        <section id="inicio">
            <img id="hero-bg-image" src="assets/hero-poster.webp" alt="Oficina corporativa impecable">
            <div class="overlay"></div>
            <div class="content">
                <h1><span id="greeting">Bienvenidos</span> a la excelencia en limpieza.</h1>
                <button class="btn-cta">Solicitar Auditoría</button>
            </div>
        </section>

        <!-- Trust Pillars -->
        <section id="confianza">
            <!-- Pillars bar content -->
        </section>

        <!-- About / Nexus Method -->
        <section id="nosotros">
            <!-- The Nexus Method content -->
        </section>

        <!-- Services -->
        <section id="servicios">
            <!-- Bento Grid content -->
        </section>

        <!-- Contact -->
        <section id="contacto">
            <!-- Contact Form -->
            <form id="contact-form"></form>
            <!-- Guarantee -->
            <div class="guarantee"></div>
        </section>
    </main>

    <!-- Mobile Sticky Bar -->
    <div id="mobile-sticky-bar">
        <!-- Mobile actions -->
    </div>

    <!-- Footer -->
    <footer id="main-footer">
        <!-- Footer content -->
    </footer>

    <!-- Scripts -->
    <script src="main.js" type="module"></script>
</body>
</html>
